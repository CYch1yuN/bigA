# Phase 3 策略研究默认配置
# 所有窗口、阈值、切分长度、随机种子、压力倍数和蒙特卡洛次数集中于此，
# 禁止在代码中硬编码。

# 初始资金（元）
initial_cash: 1000.0

# 最小交易单位（股）
lot_size: 100

# ---------------------------------------------------------------------- #
# 历史时点股票池过滤
# ---------------------------------------------------------------------- #
universe:
  min_listing_days: 120          # 上市最少交易日数
  min_valid_days: 15              # 过去 valid_days_window 日最少有效交易天数
  valid_days_window: 20           # 有效交易天数回看窗口
  min_turnover: 20000000.0       # 过去 turnover_window 日最低平均成交额（元）
  turnover_window: 20             # 成交额回看窗口

# ---------------------------------------------------------------------- #
# 滚动训练/验证/测试切分
# ---------------------------------------------------------------------- #
walk_forward:
  train_years: 3                  # 训练期长度（交易年）
  validation_months: 6            # 验证期长度（月），取训练期最后一段
  test_years: 1                   # 测试期长度（交易年）
  step_years: 1                   # 步进长度（交易年），>= test_years 保证不重叠
  min_total_years: 5              # 正式研究所需最小总交易年数

# ---------------------------------------------------------------------- #
# 稳健轨参数候选集合（固定，来自任务书）
# ---------------------------------------------------------------------- #
steady:
  trend_window: [100, 120, 140]
  momentum_window: [50, 60, 70]
  volatility_window: [15, 20, 25]
  minimum_score: [-0.25, 0.0, 0.25]

# ---------------------------------------------------------------------- #
# 激进轨参数候选集合（固定，来自任务书）
# ---------------------------------------------------------------------- #
aggressive:
  breakout_window: [15, 20, 25]
  volume_window: [15, 20, 25]
  volume_ratio: [1.2, 1.5, 1.8]
  relative_strength_window: [15, 20, 25]
  exit_low_window: [8, 10, 12]
  max_holding_days: [15, 20, 25]

# ---------------------------------------------------------------------- #
# 压力测试
# ---------------------------------------------------------------------- #
stress:
  fee_multiplier: 2.0             # 费用倍数
  slippage_multiplier: 2.0        # 滑点倍数

# ---------------------------------------------------------------------- #
# 蒙特卡洛分析（激进轨）
# ---------------------------------------------------------------------- #
monte_carlo:
  random_seed: 20260731           # 随机种子
  n_paths: 10000                  # 模拟路径数量
  path_length: 244                # 每条路径交易日长度（一年）
  block_length: 5                 # moving-block bootstrap 块长度
  initial_capital: 1000.0         # 每条路径初始资金
  ten_x_target: 10000.0           # 十倍目标资金
  loss_50_threshold: 500.0        # 50% 损失阈值
  near_zero_threshold: 100.0      # 近似归零阈值

# ---------------------------------------------------------------------- #
# 回测配置（继承 Phase 2）
# ---------------------------------------------------------------------- #
backtest:
  initial_cash: 1000.0
  lot_size: 100
  commission:
    rate: 0.0003
    minimum: 5.0
  stamp_duty:
    rate: 0.001
  transfer_fee:
    rate: 0.00001
  slippage:
    bps: 10.0
    tick_size: 0.01
  limit:
    main_ratio: 0.10
    star_ratio: 0.20
    szse_ratio: 0.10
    bjse_ratio: 0.30
    st_ratio: 0.05
    tick_size: 0.01
  risk:
    enable_single_position_limit: true
    max_position_value_ratio: 1.0
  universe:
    min_lot_value: 1000.0
