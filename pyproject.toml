[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.1.0"
description = "A 股双轨量化研究系统 - Phase 1 数据层"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trae Phase 1" }]
dependencies = [
    "duckdb>=0.10,<2.0",
    "pyarrow>=14.0,<19.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# 数据源 SDK 仅在实际抓取时需要；离线测试与标准化/质量检查不依赖它们。
sources = [
    "akshare>=1.12,<2.0",
    "baostock>=0.8.8,<1.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
]
# 大A量化研究控制台（UI-G1 Security）：仅随 Dashboard 子系统中使用，不影响量化核心离线测试。
dashboard = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "argon2-cffi>=23.1,<25.0",
    "httpx>=0.27,<1.0",
]
# 可操作工作台（UI-G2）：一次安装即同时具备 Dashboard 后端与真实数据源抓取能力。
# 这是工作台的唯一推荐安装入口（等价于 dashboard + sources + dev）。
workbench = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "argon2-cffi>=23.1,<25.0",
    "httpx>=0.27,<1.0",
    "akshare>=1.12,<2.0",
    "baostock>=0.8.8,<1.0",
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
]

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
